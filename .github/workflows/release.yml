name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DESKSUITE_GITHUB_OWNER: ${{ github.repository_owner }}
      DESKSUITE_GITHUB_REPO: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # .npmrc 的 npmmirror electron 镜像面向国内，CI 里改用官方源
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/lore-bridge

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build lore-bridge and app
        run: npm run build

      # electron-builder 会对 exe/blockmap 并发各跑一个 GitHub publisher，
      # 两个实例同时判定 release 不存在时会在同一 tag 下各建一个 release，
      # 导致产物分裂；先预创建 draft release 让它们全部复用同一个。
      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" \
                 --repo "${{ github.repository }}" \
                 --draft --title "DeskSuite ${{ github.ref_name }}" \
                 --notes "DeskSuite ${{ github.ref_name }}"

      - name: Package and publish
        run: npx electron-builder --win nsis --publish always --config electron-builder.config.cjs
